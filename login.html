<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway Authentication</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #0f172a; font-family: sans-serif; margin: 0; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 300px; text-align: center; }
        h2 { color: #f8fafc; margin-bottom: 20px; font-size: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 4px; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .error { color: #ef4444; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Enter Access Token</h2>
        <input type="password" id="tokenInput" placeholder="Paste AUTH_TOKEN here...">
        <button onclick="saveToken()">Unlock Assets</button>
        <div id="errorMsg" class="error">Invalid token layout response.</div>
    </div>

    <script>
        function saveToken() {
            const token = document.getElementById('tokenInput').value.trim();
            if (token) {
                // Save token to your browser's local cache memory
                localStorage.setItem('gatekeeper_token', token);
                // Redirect straight to your root homepage index file
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
