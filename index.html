<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Secure Network</title>
    <style>
        body { margin: 0; background-color: #0f172a; font-family: sans-serif; color: #fff; }
        
        /* Keep real content hidden by default */
        #protected-content { display: none; padding: 20px; }

        /* The Fullscreen Pure JS Security Cover Wall */
        #security-wall {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 99999;
        }
        .gateway-box { background: #1e293b; padding: 40px; border-radius: 8px; width: 340px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 20px; font-size: 22px; color: #f8fafc; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #334155; border-radius: 4px; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #1d4ed8; }
        .error-response { color: #ef4444; font-size: 14px; margin-top: 12px; display: none; }
    </style>
</head>
<body>

    <!-- 1. FULLSCREEN OVERLAY: BLOCKS ENTIRE VIEWPORT UNTIL HANDSHAKE CLEARS -->
    <div id="security-wall">
        <div class="gateway-box">
            <h2>Authentication Vault</h2>
            <input type="password" id="keyField" placeholder="Enter Account API Key or Pass...">
            <button onclick="authenticateVisitorLocal()">Verify Signature</button>
            <div id="error" class="error-response">Access Denied. Signature mismatch.</div>
        </div>
    </div>

    <!-- 2. UNRESTRICTED SYSTEM ASSETS (DYNAMICALLY RENDERED POST-VERIFICATION) -->
    <div id="protected-content">
        <h1>🔒 Security Cleared: Autonomous Lock Active</h1>
        <p>Your photos, scripts, and layouts are safely rendered locally.</p>
        <img src="GRAND OPENING (2).png" alt="Protected Network Asset">
    </div>

    <!-- 3. NATIVE CLIENT-SIDE CRYPTOGRAPHIC ENGINE -->
    <script>
        // THE LOCK VALUE: Paste your pre-computed SHA-256 password hash signatures here.
        // You can check multiple keys locally with zero server lookups.
        const VALID_HASHES = new Set([
            "555f4f0c4544c3cd92aed718f5ebdb7e0c455f22f7054d31a8548316db452848"  // bAhroozaa2007
        ]);

        // Helper function: Encrypts incoming text using native hardware WebCrypto API
        async function calculateLocalSHA256(text) {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verifyActiveSession() {
            // Scan volatile browser history memory for an existing successful login token
            const sessionStatus = sessionStorage.getItem("local_vault_unlocked");
            if (sessionStatus === "true") {
                renderSecureSite();
            }
        }

        async function authenticateVisitorLocal() {
            const enteredInput = document.getElementById("keyField").value.trim();
            const errorElement = document.getElementById("error");

            if (!enteredInput) return;

            try {
                // 1. Process client input natively using browser security crypto chips
                const computeSignature = await calculateLocalSHA256(enteredInput);

                // 2. Perform direct inline verification comparison against data arrays
                if (VALID_HASHES.has(computeSignature)) {
                    // Lock verification token into browser session tab memory cache
                    sessionStorage.setItem("local_vault_unlocked", "true");
                    renderSecureSite();
                } else {
                    errorElement.style.display = "block";
                    document.getElementById("keyField").value = "";
                }
            } catch (err) {
                errorElement.innerText = "Internal cryptographic validation error.";
                errorElement.style.display = "block";
            }
        }

        function renderSecureSite() {
            document.getElementById("security-wall").style.display = "none";
            document.getElementById("protected-content").style.display = "block";
        }

        // Initialize script sequence instantly upon loading elements
        verifyActiveSession();
    </script>
</body>
</html>
