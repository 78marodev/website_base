<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Secure Network</title>
    <style>
        body { margin: 0; background-color: #0f172a; font-family: sans-serif; color: #fff; }
        
        /* Keep real content hidden by default */
        #protected-content { display: none; padding: 20px; }

        /* The Fullscreen Pure JS Security Cover Wall */
        #security-wall {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 99999;
        }
        .gateway-box { background: #1e293b; padding: 40px; border-radius: 8px; width: 340px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 20px; font-size: 22px; color: #f8fafc; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #334155; border-radius: 4px; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #1d4ed8; }
        .error-response { color: #ef4444; font-size: 14px; margin-top: 12px; display: none; }
    </style>
</head>
<body>

    <!-- 1. FULLSCREEN OVERLAY: BLOCKS ENTIRE VIEWPORT UNTIL HANDSHAKE CLEARS -->
    <div id="security-wall">
        <div class="gateway-box">
            <h2>Authentication Vault</h2>
            <input type="password" id="keyField" placeholder="Enter Account API Key or Pass...">
            <button onclick="authenticateVisitorLocal()">Verify Signature</button>
            <div id="error" class="error-response">Access Denied. Signature mismatch.</div>
        </div>
    </div>

    <!-- 2. UNRESTRICTED SYSTEM ASSETS (DYNAMICALLY RENDERED POST-VERIFICATION) -->
    <div id="protected-content">
        <h1>🔒 Security Cleared: Autonomous Lock Active</h1>
        <p>Your photos, scripts, and layouts are safely rendered locally.</p>
        <iframe src="_index.html" width="100%" height="100%">
    </div>

<script>
    function saveToken() {
        const token = document.getElementById('tokenInput').value.trim();
        
        // This must match what your self-hosted backend API responds with ("hello martin ")
        if (token === "hello martin ") {
            // Save token cookie globally onto your custom domain root path
            document.cookie = "gatekeeper_token=hello martin ; path=/; secure; samesite=strict; max-age=86400";
            
            // Instantly hard-reload straight onto your clean main address bar
            window.location.replace("/");
        } else {
            document.getElementById("errorMsg").style.display = "block";
        }
    }
</script>

</body>
</html>
