<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Secure Network</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0f172a; font-family: sans-serif; color: #fff; overflow: hidden; }
        
        /* Keep real content hidden by default */
        #protected-content { display: none; width: 100%; height: 100%; box-sizing: border-box; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }

        /* The Fullscreen Pure JS Security Cover Wall */
        #security-wall {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 99999;
        }
        .gateway-box { background: #1e293b; padding: 40px; border-radius: 8px; width: 340px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 20px; font-size: 22px; color: #f8fafc; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #334155; border-radius: 4px; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #1d4ed8; }
        .error-response { color: #ef4444; font-size: 14px; margin-top: 12px; display: none; }
    </style>
</head>
<body>

    <!-- 1. FULLSCREEN OVERLAY: BLOCKS ENTIRE VIEWPORT UNTIL HANDSHAKE CLEARS -->
    <div id="security-wall">
        <div class="gateway-box">
            <h2>Authentication Vault</h2>
            <input type="password" id="keyField" placeholder="Enter Account API Key or Pass...">
            <button onclick="requestAccessFromBackend()">Verify Signature</button>
            <div id="error" class="error-response">Access Denied. Signature mismatch.</div>
        </div>
    </div>

    <!-- 2. UNRESTRICTED SYSTEM ASSETS (DYNAMICALLY RENDERED POST-VERIFICATION) -->
    <div id="protected-content">
        <!-- Renders your private internal index file cleanly inside an absolute wrapper -->
        <iframe src="_index.html"></iframe>
    </div>

    <!-- 3. SECURE FRONTEND HANDSHAKE ENGINE -->
    <script>
        // REPLACE THIS URL with your live self-hosted Render backend domain link
        const BACKEND_API_URL = "https://onrender.com";

        async function verifyActiveSession() {
            // Read validation token cookie from browser history cache parameters
            const cookieHeader = document.cookie || "";
            if (cookieHeader.includes("gatekeeper_token=hello%20martin%20") || cookieHeader.includes("gatekeeper_token=hello martin ")) {
                renderSecureSite();
            }
        }

        async function requestAccessFromBackend() {
            const enteredKey = document.getElementById("keyField").value.trim();
            const errorElement = document.getElementById("error");

            if (!enteredKey) return;

            try {
                // Post verification values straight to your private Node.js server endpoint
                const response = await fetch(`${BACKEND_API_URL}/api/verify`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ authKey: enteredKey })
                });

                const result = await response.json();

                if (response.ok && result.valid) {
                    // Save token cookie globally onto your custom domain root path for Cloudflare tracking
                    document.cookie = `gatekeeper_token=${encodeURIComponent(result.sessionToken)}; path=/; secure; samesite=strict; max-age=86400`;
                    renderSecureSite();
                } else {
                    errorElement.style.display = "block";
                    document.getElementById("keyField").value = "";
                }
            } catch (err) {
                errorElement.innerText = "Backend API server connection error.";
                errorElement.style.display = "block";
            }
        }

        function renderSecureSite() {
            document.getElementById("security-wall").style.display = "none";
            document.getElementById("protected-content").style.display = "block";
        }

        // Initialize script logic instantly upon asset generation
        verifyActiveSession();
    </script>
</body>
</html>
