<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway Access</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; color: white; margin: 0; }
        .login-card { padding: 40px; background: #1e1e1e; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #0070f3; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #0051a8; }
        .error { color: #ff3333; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Secure Gateway</h2>
        <p style="color: #888; font-size: 14px;">Enter passcode to unlock the network</p>
        <input type="password" id="passcode" placeholder="Enter Passcode">
        <button onclick="submitLogin()">Unlock</button>
        <p id="error-msg" class="error">Invalid Passcode</p>
    </div>

    <script>
        async function submitLogin() {
            const passwordInput = document.getElementById('passcode').value;
            const errorElement = document.getElementById('error-msg');
            errorElement.style.display = 'none';

            try {
                // FIXED: Explicitly added /api/login to target the correct backend endpoint path
                const response = await fetch('https://api.theblackmeadow.qzz.io', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passwordInput }),
                    credentials: 'include' // CRITICAL: Allows browser to save cross-domain cookies
                });

                const data = await response.json();

                if (response.status === 200 && data.success) {
                    // Redirects smoothly to your primary website folder path destination
                    window.location.href = "https://theblackmeadow.qzz.io/portifolio";
                } else {
                    errorElement.style.display = 'block';
                }
            } catch (err) {
                alert("Cannot connect to backend server. Make sure your tunnel is running.");
            }
        }
    </script>

</body>
</html>
