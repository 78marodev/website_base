<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {
            margin: 0;

            background-color: #0f172a;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {

            margin-top: 2rem;

        }
        a {

            font-weight: 500;
        }
        a:hover {

        }
